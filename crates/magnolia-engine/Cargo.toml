[package]
name = "magnolia-engine"
description = "Magnolia's audio engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The queues between the controller, the processor and the collector (docs/ARCHITECTURE.md).
rtrb.workspace = true

# Proves RealtimeSanitizer's verdicts. Only scripts/check.sh runs it, naming it, with the nightly
# toolchain, `-Zsanitizer=realtime` and `--cfg magnolia_rtsan` (ADR-0019); `cargo test` skips it.
[[test]]
name = "realtime_sanitizer"
harness = false
test = false

# Measures the time model's conversions per block; prints its figures (docs/measurements.md).
[[bench]]
name = "time_conversions"
harness = false

[lints]
workspace = true
