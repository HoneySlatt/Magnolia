# The Cargo workspace: every crate of Magnolia lives under crates/ (docs/ARCHITECTURE.md). The
# toolchain is pinned in rust-toolchain.toml (ADR-0013).
[workspace]
resolver = "3"
members = ["crates/*"]

# Every dependency is put to the owner first: its reason, an alternative weighed, its license
# (AGENTS.md). Versions live here once; crates take them with `workspace = true`.
[workspace.dependencies]
magnolia-engine = { path = "crates/magnolia-engine" }
magnolia-jack = { path = "crates/magnolia-jack" }
magnolia-session = { path = "crates/magnolia-session" }
# The JACK API, which PipeWire and JACK2 both serve (ADR-0007). It loads libjack at run time, so the
# engine starts and says so when JACK is missing; its `log` feature is off.
jack = { version = "0.14", default-features = false, features = ["dynamic_loading"] }
# Single-producer single-consumer queues that never allocate, lock or block once built: what the
# real-time thread exchanges with the others.
rtrb = "0.4"
# The C library's calls that std lacks: the audio thread's id and its scheduling policy, asked of the
# kernel to say whether it runs in real time (ADR-0023). Used by the JACK backend alone.
libc = "0.2"
# The test session's JSON, read and written (ADR-0028). Used by the test session alone; the engine
# never sees them.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/HoneySlatt/Magnolia"
publish = false

# scripts/check.sh turns every warning into an error.
[workspace.lints.rust]
missing_docs = "warn"
# `magnolia_rtsan` gates what only the nightly builds, for RealtimeSanitizer; scripts/check.sh sets
# it beside `-Zsanitizer=realtime` (ADR-0019).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(magnolia_rtsan)"] }

[workspace.lints.clippy]
# AGENTS.md: every `unsafe` block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
